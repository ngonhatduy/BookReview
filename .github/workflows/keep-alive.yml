name: Keep Supabase Alive

on:
  schedule:
    # Ping every 5 days at 02:00 UTC (09:00 UTC+7) to prevent 7-day inactivity pause
    - cron: '0 2 */5 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret." >&2
            exit 1
          fi

          curl -fsS --retry 2 --max-time 15 \
            "${SUPABASE_URL%/}/rest/v1/books?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" > /dev/null

          echo "Supabase keep-alive ping succeeded at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
